<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><title>Form definition</title></head>
<body id="netlify-form-reference">
  <!-- Netlify scans this static asset; keep names identical to PartnershipForm. -->
  <form name="international-partnerships" method="POST" data-netlify="true" netlify-honeypot="fax" hidden>
      <input type="hidden" name="form-name" value="international-partnerships">
      <input name="locale" type="text">
      <input name="fax" type="text">
      <input name="organisation" type="text">
      <input name="country" type="text">
      <input name="name" type="text">
      <input name="role" type="text">
      <input name="email" type="email">
      <input name="phone" type="text">
      <input name="website" type="text">
      <input name="area" type="text">
      <input name="type" type="text">
      <textarea name="description"></textarea>
      <input type="checkbox" name="consent" value="yes">
  </form>
</body>
</html>
